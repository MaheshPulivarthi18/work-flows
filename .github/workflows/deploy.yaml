name: Deploy Time App to AWS EKS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ secrets.DOCKERHUB_USERNAME }}/time-app:latest
        run: |
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubectl and update kubeconfig
        run: |
          aws sts get-caller-identity
          aws eks describe-cluster --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Verify Kubernetes access
        run: |
          kubectl config current-context
          kubectl cluster-info

      - name: Deploy to EKS
        run: |
          kubectl version --client
          kubectl apply -f k8s/deployment.yaml || kubectl apply --validate=false -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml || kubectl apply --validate=false -f k8s/service.yaml
          sleep 10
          kubectl get pods
          kubectl get svc
